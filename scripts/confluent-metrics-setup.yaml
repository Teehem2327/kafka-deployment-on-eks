---
# PodMonitor as fallback to catch all Confluent pods with prometheus port
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: confluent-pods
  namespace: monitoring
  labels:
    app: confluent
    release: monitoring
spec:
  selector:
    matchLabels:
      platform.confluent.io/type: kafka
  namespaceSelector:
    matchNames:
      - confluent
  podMetricsEndpoints:
    - port: prometheus
      interval: 30s
      path: /metrics
    - port: jmx
      interval: 30s
      path: /metrics
