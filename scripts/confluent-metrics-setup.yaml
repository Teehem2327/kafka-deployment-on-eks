---
# JMX Exporter ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: jmx-exporter-config
  namespace: confluent
data:
  config.yml: |
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    whitelistObjectNames:
      - kafka.server:*
      - kafka.cluster:*
      - kafka.controller:*
      - kafka.network:*
      - kafka.log:*
      - java.lang:*
    rules:
      - pattern: ".*"
---
# ServiceMonitor for Kafka
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: confluent-kafka
  namespace: monitoring
  labels:
    app: kafka
    release: monitoring
spec:
  selector:
    matchLabels:
      app: kafka
  namespaceSelector:
    matchNames:
      - confluent
  endpoints:
    - port: prometheus
      interval: 30s
      path: /metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
---
# ServiceMonitor for Schema Registry
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: confluent-schemaregistry
  namespace: monitoring
  labels:
    app: schemaregistry
    release: monitoring
spec:
  selector:
    matchLabels:
      app: schemaregistry
  namespaceSelector:
    matchNames:
      - confluent
  endpoints:
    - port: prometheus
      interval: 30s
      path: /metrics
---
# ServiceMonitor for Connect
